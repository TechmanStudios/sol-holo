[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sol-holo"
version = "1.0.0"
description = "SOL-Holo: Holographic Autopoietic Continuum & Sovereign Digital Organism (Frontiers A-N)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Techman Studios" }
]
dependencies = [
  "numpy>=1.26.0",
  "scipy>=1.11.0",
  "pydantic>=2.5.0",
]

[project.optional-dependencies]
live = [
  "google-genai>=1.0.0",
]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
sol-holo = "sol_holo.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sol_holo*"]
